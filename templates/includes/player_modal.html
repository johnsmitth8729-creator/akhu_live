{% load i18n %}
<!-- CCTV/VMS Player Modal (YouTube Live Inspired Redesign) -->
<div class="modal fade vms-player-modal" id="vmsPlayerModal" tabindex="-1" aria-labelledby="vmsPlayerModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg overflow-hidden style-yt-modal">
            <!-- Modal Header -->
            <div class="modal-header border-0 bg-dark text-white px-3 py-2.5 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <span id="playerStatusBadge" class="vms-player-status-badge status-live">
                        <span class="badge-dot"></span>
                        <span id="playerStatusText">LIVE</span>
                    </span>
                    <h5 class="modal-title fw-bold m-0 fs-6 text-white" id="vmsPlayerModalLabel">{% translate "Camera Stream" %}</h5>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="closePlayerModal()"></button>
            </div>
            
            <div class="modal-body p-0 bg-black position-relative">
                <!-- Dual Engine Viewports Wrapper -->
                <div class="vms-video-viewport position-relative overflow-hidden" id="vmsVideoViewport" style="aspect-ratio: 16/9;">
                    <!-- Real-Time Playback Timestamp Overlay -->
                    <div class="position-absolute top-0 end-0 m-3 px-2.5 py-1 rounded bg-dark bg-opacity-75 text-white font-monospace shadow z-3" style="font-size: 0.75rem;" id="playerTimestampOverlay">
                        <i class="fa-regular fa-clock me-1.5 text-info"></i>
                        <span id="playerTimestampText">--:--:--</span>
                    </div>

                    <!-- Engine 1: LIVE (WebRTC WHEP) -->
                    <div class="vms-engine engine-active" id="liveEngine">
                        <video id="playerLiveVideo" autoplay muted playsinline class="w-100 h-100 bg-black"></video>
                    </div>

                    <!-- Engine 2: DVR (MSE fmp4 playback) -->
                    <div class="vms-engine" id="dvrEngine">
                        <video id="playerDvrVideo" playsinline class="w-100 h-100 bg-black"></video>
                    </div>

                    <!-- Embedded Overlay Controls -->
                    <div class="yt-overlay-controls position-absolute bottom-0 start-0 end-0 p-3 z-3 d-flex flex-column gap-2" id="ytOverlayControls">
                        <div class="yt-seekbar-container position-relative w-100 mb-1" id="ytSeekBarContainer" style="height: 36px; cursor: pointer;">
                            <canvas id="dvrCctvTimelineCanvas" class="w-100 rounded border border-secondary border-opacity-25 h-100 d-none" style="cursor: pointer;"></canvas>
                            <div class="yt-seekbar-track position-absolute top-50 start-0 end-0 translate-middle-y rounded-pill" style="height: 6px; background: rgba(255, 255, 255, 0.25);">
                                <div class="yt-seekbar-fill position-absolute top-0 start-0 h-100 bg-danger rounded-pill" id="ytSeekBarFill" style="width: 100%;"></div>
                                <div class="yt-seekbar-handle position-absolute top-50 translate-middle rounded-circle bg-danger border border-2 border-white shadow" id="ytSeekBarHandle" style="left: 100%; width: 16px; height: 16px;"></div>
                            </div>
                            <div class="yt-preview-tooltip position-absolute bg-dark text-white rounded px-2 py-1 shadow border border-secondary z-3 d-none translate-middle-x" id="ytPreviewTooltip" style="bottom: 28px; font-size: 0.75rem;">
                                <div class="text-center font-monospace" id="ytPreviewTime">-00:05:00</div>
                            </div>
                            <span class="dvr-time-display badge bg-dark bg-opacity-75 border border-secondary border-opacity-25 position-absolute end-2 top-0" id="dvrTimeDisplay" style="font-size: 0.7rem;">LIVE</span>
                        </div>

                        <!-- Bottom Controls Toolbar -->
                        <div class="d-flex justify-content-between align-items-center w-100 pt-1">
                            <div class="d-flex align-items-center gap-2">
                                <button class="yt-ctrl-btn" onclick="togglePlayPause()" title="Play / Pause (Space)">
                                    <i class="fa-solid fa-play" id="ytPlayIcon"></i>
                                </button>
                                <button class="yt-ctrl-btn" onclick="toggleAudioMute()" title="Mute (M)">
                                    <i class="fa-solid fa-volume-high" id="ytVolumeIcon"></i>
                                </button>
                                <button class="yt-live-btn active ms-2" id="btnShiftLive" onclick="switchToLive()" title="Go LIVE (L)">
                                    <span class="yt-live-dot"></span>
                                    <span>Live</span>
                                </button>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <button class="btn-go-live btn-sm" id="btnGoLive" onclick="switchToLive()" disabled>
                                    <i class="fa-solid fa-tower-broadcast me-1"></i> Go Live
                                </button>

                                <div class="dropdown">
                                    <button class="yt-ctrl-btn" type="button" id="qualitySelectBtn" data-bs-toggle="dropdown" aria-expanded="false" title="Quality Settings">
                                        <i class="fa-solid fa-gear"></i>
                                    </button>
                                    <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" aria-labelledby="qualitySelectBtn" style="font-size: 0.8rem;">
                                        <li><h6 class="dropdown-header">{% translate "Quality" %}</h6></li>
                                        <li><a class="dropdown-item active" href="#" onclick="selectPlayerQuality('auto')"><i class="fa-solid fa-check me-1 text-primary"></i> Auto (Recommended)</a></li>
                                        <li><a class="dropdown-item" href="#" onclick="selectPlayerQuality('1080p')">1080p HD</a></li>
                                        <li><a class="dropdown-item" href="#" onclick="selectPlayerQuality('720p')">720p HD</a></li>
                                    </ul>
                                </div>

                                <button class="yt-ctrl-btn" onclick="togglePlayerModalFullscreen()" title="Fullscreen (F)">
                                    <i class="fa-solid fa-expand"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
