{% load i18n %}
<!-- Enterprise CCTV/VMS Player Modal -->
<div class="modal fade vms-player-modal" id="vmsPlayerModal" tabindex="-1" aria-labelledby="vmsPlayerModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg overflow-hidden style-yt-modal">
            <!-- Modal Header -->
            <div class="modal-header border-0 bg-dark text-white px-3 py-2 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-3">
                    <span id="playerStatusBadge" class="vms-player-status-badge status-live">
                        <span class="badge-dot"></span>
                        <span id="playerStatusText">LIVE</span>
                    </span>
                    <h5 class="modal-title fw-bold m-0 fs-6 text-white" id="vmsPlayerModalLabel">{% translate "Camera Stream" %}</h5>
                    <span class="badge bg-secondary-subtle text-secondary" style="font-size:0.65rem;" id="playerLocationBadge">--</span>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" onclick="closePlayerModal()"></button>
            </div>
            
            <div class="modal-body p-0 bg-black position-relative">
                <!-- Dual Engine Viewports Wrapper -->
                <div class="vms-video-viewport position-relative overflow-hidden" id="vmsVideoViewport" style="aspect-ratio: 16/9;" onmousemove="handleViewportMouseMove(this)">
                    <!-- Real-Time Playback Timestamp Overlay -->
                    <div class="position-absolute top-0 end-0 m-3 px-2.5 py-1 rounded bg-dark bg-opacity-75 text-white font-monospace shadow z-3" style="font-size: 0.75rem;" id="playerTimestampOverlay">
                        <i class="fa-regular fa-clock me-1.5 text-info"></i>
                        <span id="playerTimestampText">--:--:--</span>
                    </div>

                    <!-- Engine 1: LIVE (WebRTC WHEP / HLS) -->
                    <div class="vms-engine engine-active" id="liveEngine">
                        <video id="playerLiveVideo" autoplay playsinline class="w-100 h-100 bg-black"></video>
                        <!-- Floating Unmute Audio Overlay Button for Mobile Browsers -->
                        <button type="button" id="unmuteOverlayBtn" class="btn btn-danger btn-sm position-absolute top-50 start-50 translate-middle z-3 shadow-lg px-3 py-2 rounded-pill d-none" onclick="unmutePlayerAudio()">
                            <i class="fa-solid fa-volume-xmark me-2"></i>
                            <span class="fw-bold">{% translate "Ovozni yoqish (Unmute)" %}</span>
                        </button>
                    </div>

                    <!-- Engine 2: DVR (MSE fmp4 playback for recorded sessions) -->
                    <div class="vms-engine" id="dvrEngine">
                        <video id="playerDvrVideo" playsinline class="w-100 h-100 bg-black"></video>
                    </div>

                    <!-- Embedded Overlay Controls -->
                    <div class="yt-overlay-controls position-absolute bottom-0 start-0 end-0 p-3 z-3 d-flex flex-column gap-2" id="ytOverlayControls">
                        <!-- Seek Bar for Rolling Live Buffer (30s-120s Rewind Window) -->
                        <div class="yt-seekbar-container position-relative w-100 mb-1" id="ytSeekBarContainer" style="height: 24px; cursor: pointer;">
                            <div class="yt-seekbar-track position-absolute top-50 start-0 end-0 translate-middle-y rounded-pill" style="height: 5px; background: rgba(255, 255, 255, 0.25);">
                                <div class="yt-seekbar-fill position-absolute top-0 start-0 h-100 bg-primary rounded-pill" id="ytSeekBarFill" style="width: 100%;"></div>
                                <div class="yt-seekbar-handle position-absolute top-50 translate-middle rounded-circle bg-primary border border-2 border-white shadow" id="ytSeekBarHandle" style="left: 100%; width: 14px; height: 14px;"></div>
                            </div>
                        </div>

                        <!-- Bottom Controls Toolbar -->
                        <div class="d-flex justify-content-between align-items-center w-100 pt-1">
                            <div class="d-flex align-items-center gap-2">
                                <button class="yt-ctrl-btn" onclick="togglePlayPause()" title="Play / Pause (Space)">
                                    <i class="fa-solid fa-play" id="ytPlayIcon"></i>
                                </button>
                                
                                <!-- Audio Group with Hover/Interactive Volume Slider -->
                                <div class="d-flex align-items-center yt-volume-group">
                                    <button class="yt-ctrl-btn" onclick="toggleAudioMute()" title="Mute / Unmute (M)">
                                        <i class="fa-solid fa-volume-high" id="ytVolumeIcon"></i>
                                    </button>
                                    <input type="range" class="form-range yt-volume-slider" id="ytVolumeSlider" min="0" max="1" step="0.05" value="1" oninput="setPlayerVolume(this.value)" title="Volume">
                                </div>

                                <button class="yt-live-btn active ms-2" id="btnShiftLive" title="Live Stream" onclick="switchToLiveEdge()">
                                    <span class="yt-live-dot"></span>
                                    <span>LIVE</span>
                                </button>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <button class="yt-ctrl-btn" onclick="togglePlayerModalFullscreen()" title="Fullscreen (F)">
                                    <i class="fa-solid fa-expand"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Enterprise Connection Telemetry Footer -->
            <div class="modal-footer border-0 px-3 py-2 d-flex justify-content-between align-items-center small" style="font-size: 0.75rem; background-color: #0F172A !important; color: #FFFFFF !important;">
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white-50"><i class="fa-solid fa-gauge-high text-primary me-1"></i>FPS: <strong class="text-white" id="modalFpsVal">30</strong></span>
                    <span class="border-start border-secondary border-opacity-50 ps-3 text-white-50"><i class="fa-solid fa-network-wired text-info me-1"></i>Bitrate: <strong class="text-white" id="modalBitrateVal">1.2 Mbps</strong></span>
                    <span class="border-start border-secondary border-opacity-50 ps-3 text-white-50"><i class="fa-solid fa-microchip text-warning me-1"></i>Codec: <strong class="text-white">H.264 / AAC</strong></span>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white-50"><i class="fa-solid fa-signal text-success me-1"></i>Quality: <span class="badge bg-success-subtle text-success py-0.5 px-1.5" style="font-size:0.65rem;">Excellent</span></span>
                    <span class="border-start border-secondary border-opacity-50 ps-3 text-white-50"><i class="fa-solid fa-clock-rotate-left text-info me-1"></i>Latency: <strong class="text-white">&lt; 300ms</strong></span>
                </div>
            </div>
        </div>
    </div>
</div>
