{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Edit Recording" %} | {{ SYSTEM_NAME }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm rounded-3 p-4">
            <h4 class="fw-bold mb-3">{% translate "Edit Recording Metadata" %}</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">{% translate "Title" %}</label>
                    <input type="text" name="title" class="form-control" value="{{ form.title.value|default:object.title }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">{% translate "Description" %}</label>
                    <textarea name="description" class="form-control" rows="3">{{ form.description.value|default:object.description }}</textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">{% translate "Retention Policy" %}</label>
                    <select name="retention_policy" class="form-select">
                        <option value="never" {% if object.retention_policy == 'never' %}selected{% endif %}>Never Delete</option>
                        <option value="7_days" {% if object.retention_policy == '7_days' %}selected{% endif %}>Delete after 7 days</option>
                        <option value="14_days" {% if object.retention_policy == '14_days' %}selected{% endif %}>Delete after 14 days</option>
                        <option value="30_days" {% if object.retention_policy == '30_days' %}selected{% endif %}>Delete after 30 days</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'recordings:list' %}" class="btn btn-secondary btn-sm">{% translate "Cancel" %}</a>
                    <button type="submit" class="btn btn-primary btn-sm">{% translate "Save Changes" %}</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
